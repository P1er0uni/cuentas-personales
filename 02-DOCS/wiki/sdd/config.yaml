version: 1
project:
  root: .
  stacks: [node, express, supabase]
  package_managers: [npm]
  monorepo: false
  signals:
    - package.json (type: module, express ^5.3.0, @supabase/supabase-js ^2.119.0)
    - vitest ^5.1.0 en devDependencies
    - frontend estático en public/ sin paso de build
    - esquema en el proyecto Supabase getjrfqsirqflixdkdvl (migraciones vía MCP)
sdd:
  artifact_store: 02-DOCS/wiki/sdd
  execution_mode: interactive
  registry_path: .rsc/skill-registry.json
  review_budget:
    line_budget: 400
    file_budget: 12
  delivery_strategy:
    default: ask-on-risk
testing:
  strict_tdd: true
  runners: [vitest]
  commands:
    apply: [npm test]
    verify: [npm test]
phase_rules:
  proposal: optional-on-ambiguity
  specify: requires intent or proposal
  plan: requires spec
  tasks: requires plan and spec
  analyze: requires spec plan tasks
  implement: requires analyze pass, strict_tdd when testing.strict_tdd is true
  verify: requires spec tasks evidence
  archive: requires verify record and review/ship outcome
models:
  enabled: false              # opt-in master switch; false = honor session model, announce nothing
  provider: anthropic
  tiers:
    heavy: claude-opus-4-8
    balanced: claude-sonnet-4-6
    light: claude-haiku-4-5-20251001
  phases:
    constitution: heavy
    specify: balanced
    clarify: balanced
    plan: heavy
    tasks: balanced
    analyze: heavy
    implement: balanced
    verify: balanced
    review: heavy
    ship: light
    debug: heavy
    worktrees: light
    sdd-init: light
  overrides: {}
